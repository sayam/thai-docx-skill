# The mutants: each row plants one defect in one tracked file and names the test that must then
# fail. tools/run_mutants.py plants every row in a copy of the tree on every pull request and at
# the tag; a mutant the test lets through is a C1 control that no longer holds (ADR 0041), and
# the run fails. tests/test_mutants.py holds every row to this shape, and the runner to its verdicts.
#
# id        the mutant's name: what the defect is, as the code would then behave
# file      the tracked file the change is made in — never in place, always in a copy
# find      the text as it stands, which must be in the file exactly once
# replace   the text it becomes; the file must still compile (a .py, the bundle, JSON, YAML)
# test      the pytest node ids, `file::function`, that fail on the mutant: exit 1 and no other
# holds     the ledger row in tests/regressions.yaml, or the gate in gates.yaml, this mutant holds
#
# The list began with the mutants the reviews of 0.2.0 planted by hand — the limits, the checker's
# causes, the build's fidelity check, the bundle, the licence lines, the citation — and with one
# mutant for each ledger row of 0.3.1, 0.3.2 and 0.3.3 whose test does not hold repair. Every
# ledger row from here on comes with its mutant. A limit that both implementations state has a
# mutant on each side.

