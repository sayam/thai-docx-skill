# The starting workflow for a project that installs this bundle. `install.py`
# writes it to .github/workflows/gates.yml and never overwrites it after that.
#
# This is a *starting point, not a ceiling*: the gates of kind `suite` in
# tools/overlay.json need tests the project writes itself, and they are reported
# as pending on every run until it does.
name: gates

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  # Runs every gate of kind `scan` in tools/overlay.json, under a bare python3.
  scans:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Pinned by SHA, per this bundle's own actions-sha-pinned rule (v7.0.1)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 tools/gates_doctor.py

  # Every commit a push or pull request adds is a Conventional Commit, signed off, with no
  # assistant trailers (ADR 0013). A fork never ran a hook of ours; this is where it is held.
  commits:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: lint the commits this event adds
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          # the first push of a branch has no "before": every commit it carries is linted;
          # after a force push "before" is gone: lint what the branch adds to main
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            range="$HEAD_SHA"
          elif ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            range="$(git merge-base origin/main "$HEAD_SHA")..$HEAD_SHA"
          else
            range="$BASE..$HEAD_SHA"
          fi
          python3 tools/lint_commits.py --range "$range"

  # Runs the suite on the oldest Python the skill promises (ADR 0008).
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      # Node runs the CommonMark reference implementation the parser is held to (ADR 0015)
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - run: python3 -m pip install --require-hashes -r requirements/dev.txt
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: tests/js
      # under coverage, subprocesses included; the report fails below .coveragerc's floor
      - run: python3 -m coverage run -m pytest -q tests
      - run: python3 -m coverage combine -q && python3 -m coverage report

  # The coding standards: PEP 8, pyflakes and bugbear over the skill, the tools and the tests
  # (ruff.toml); ESLint's recommended rules over js/*.js (tests/js/eslint.config.cjs).
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - run: python3 -m pip install --require-hashes -r requirements/dev.txt
      - run: python3 -m ruff check --no-cache skills/thai-docx/scripts tools tests
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: tests/js
      - name: eslint
        run: tests/js/node_modules/.bin/eslint --config tests/js/eslint.config.cjs js
