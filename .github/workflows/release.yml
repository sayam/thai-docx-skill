# What a person who only uses the skill downloads: `thai-docx-<version>.zip`, the
# skill directory and nothing else — no gates, tests or records (ADR 0018). The
# repository's own source archives leave those out too (.gitattributes).
#
# The archive is built from the tag, refused unless every place that states the
# version states the tag, attested (so a downloader can check CI built it), verified
# in both directions, and only then attached. The attestation is attached too, so the
# proof travels with the archive and needs no GitHub account to read:
#
#     gh attestation verify thai-docx-<version>.zip --repo sayam/thai-docx-skill \
#         --signer-workflow sayam/thai-docx-skill/.github/workflows/release.yml --source-ref refs/tags/v<version>
#     gh attestation verify thai-docx-<version>.zip --bundle thai-docx-<version>.intoto.jsonl \
#         --repo sayam/thai-docx-skill \
#         --signer-workflow sayam/thai-docx-skill/.github/workflows/release.yml --source-ref refs/tags/v<version>
#
# The tag is checked out as a tag — `refs/tags/<tag>` — because a bare name is looked for
# among the branches first, and a branch of the same name would be built in its place.

name: release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: an existing release tag to build and attach the skill archive to
        required: true

permissions:
  contents: read

jobs:
  # The tag is held to the gates and the suite again: a release is cut from a commit,
  # and nothing else proves that commit's own run was green. The gates are the ones
  # gates.yml runs on a pull request — the scans, the lints, the suite under its
  # coverage floor — not a part of them.
  release-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TAG: ${{ github.event.inputs.tag || github.event.release.tag_name }}
    steps:
      - name: the tag is a release tag
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "not a release tag: $TAG"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ github.event.inputs.tag || github.event.release.tag_name }}
      - name: what was checked out is the tag's commit
        run: test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$TAG^{commit}")"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - run: python3 tools/gates_doctor.py
      - run: python3 -m pip install --require-hashes -r requirements/dev.txt
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: tests/js
      - run: python3 -m ruff check --no-cache skills/thai-docx/scripts tools tests
      - name: eslint
        run: tests/js/node_modules/.bin/eslint --config tests/js/eslint.config.cjs js
      # under coverage, subprocesses included; the report fails below .coveragerc's floor
      - run: python3 -m coverage run -m pytest -q tests
      - run: python3 -m coverage combine -q && python3 -m coverage report
      # no release while a development dependency has a known vulnerability (CONTRIBUTING, Dependencies)
      - name: osv-scanner
        uses: docker://ghcr.io/google/osv-scanner-action@sha256:71ad04ab2f8798be47870f9b18817ad317c2f8f2f97aa6726ba10d5578bc174a # v2.6.0
        with:
          entrypoint: osv-scanner
          args: scan source --lockfile=requirements.txt:requirements/dev.txt --lockfile=tests/js/package-lock.json

  release-archive:
    needs: release-check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ github.event.inputs.tag || github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ github.event.inputs.tag || github.event.release.tag_name }}
      - name: what was checked out is the tag's commit
        run: test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$TAG^{commit}")"
      - name: every stated version is the tag
        run: python3 tools/package_skill.py --tag "$TAG"
      - name: pack the skill directory, and nothing else
        run: |
          set -euo pipefail
          mkdir dist
          python3 tools/package_skill.py "dist/thai-docx-${TAG#v}.zip"
          python3 -c "import sys, zipfile; n = zipfile.ZipFile(sys.argv[1]).namelist(); assert n and all(x.startswith('thai-docx/') for x in n) and 'thai-docx/SKILL.md' in n, n; print(len(n), 'files')" dist/*.zip
      - name: attest build provenance for the archive
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.zip
      - name: keep the attestation beside the archive, under the name a verifier expects
        run: |
          set -euo pipefail
          ZIP=$(ls dist/*.zip)
          # the archive's own base name, so a reader sees which file it belongs to;
          # .intoto.jsonl because that is the suffix `gh attestation verify --bundle`
          # and OpenSSF Scorecard's provenance probe both read
          cp "${{ steps.attest.outputs.bundle-path }}" "${ZIP%.zip}.intoto.jsonl"
          python3 -c "import json, sys; [json.loads(l) for l in open(sys.argv[1], encoding='utf-8') if l.strip()]; print('bundle is one JSON object per line')" "${ZIP%.zip}.intoto.jsonl"
      - name: verify in both directions before anything is attached
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ZIP=$(ls dist/*.zip)
          BUNDLE="${ZIP%.zip}.intoto.jsonl"
          # a fresh attestation can take a moment to be served
          # bound to this workflow and to the tag, so an attestation some other workflow or ref
          # made for the same bytes does not pass
          for try in 1 2 3 4 5; do
            if gh attestation verify "$ZIP" --repo "$GITHUB_REPOSITORY" \
                --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" --source-ref "refs/tags/$TAG"; then break; fi
            [ "$try" = 5 ] && exit 1
            sleep 15
          done
          # and offline, against the file that is about to be attached: this is what a
          # reader without a GitHub account can do
          gh attestation verify "$ZIP" --bundle "$BUNDLE" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" --source-ref "refs/tags/$TAG"
          cp "$ZIP" tampered.zip && printf 'x' >> tampered.zip
          if gh attestation verify tampered.zip --repo "$GITHUB_REPOSITORY"; then
            echo "a tampered archive verified — the verifier reads nothing"; exit 1
          fi
          if gh attestation verify tampered.zip --bundle "$BUNDLE" --repo "$GITHUB_REPOSITORY"; then
            echo "a tampered archive verified against the attached bundle"; exit 1
          fi
      - name: attach the archive and its attestation to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/*.zip dist/*.intoto.jsonl --clobber
