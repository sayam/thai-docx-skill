# This project's gate registry. vgproj wrote the first four rows; the rest are
# this skill's own gates, each pointing at the job that decides it. The scans
# about templates, services, entrypoints and Dockerfiles answer NA on a tree
# that has none. `gates-registry-total` holds this index to the workflows and
# the test files in both directions.

version: 1
gates:
  - id: adr-index-complete
    title: The ADR index covers every record, numbered without repeats or gaps · and supersessions are recorded in both directions
    kind: job
    severity: blocking
    enforced_by: {job: scans}
  - id: gates-registry-total
    title: The gate index matches reality in both directions, and every test file is accounted for
    kind: job
    severity: blocking
    enforced_by: {job: scans}
  - id: actions-sha-pinned
    title: Every action is pinned to a commit SHA with the version in a comment
    kind: job
    severity: blocking
    enforced_by: {job: scans}
  - id: ci-tools-hash-pinned
    title: Tools CI installs for itself are pinned by hash, on both the Python and the Node side
    kind: job
    severity: blocking
    enforced_by: {job: scans}
  - id: conventional-commits
    title: Every commit a push or pull request adds is a Conventional Commit, signed off (DCO 1.1), with no assistant trailers (ADR 0013)
    kind: job
    severity: blocking
    enforced_by: {job: commits}
  - id: pr-description-credits-the-signer
    title: A pull request's description opens no line with an assistant's trailer, its "Generated with" footer or a link to its session, and reaches the checker through the environment, never a script (ADR 0013)
    kind: job
    severity: blocking
    enforced_by: {job: pr-description}
  - id: pr-description-checker-proven-two-way
    title: The description checker refuses an assistant's default footer in every form, passes a description that only mentions one, reads the description as data, and the workflow hands it over through the environment and runs again on an edit (ADR 0013)
    kind: test
    severity: blocking
    enforced_by: {job: tests, tests: [tests/test_pr_body.py]}
  - id: docx-checker-proven-two-way
    title: The checker names each of the five causes (ADR 0004), invisible text and misordered properties on a planted violation in any part that holds text a reader sees — body, comments, footnotes, endnotes, headers, footers — passes a clean package, and refuses DOCTYPE and oversized packages
    kind: test
    severity: blocking
    enforced_by: {job: tests, tests: [tests/test_check.py]}
    proved_by: [docs/evidence/2026-09-15-checker-red-evidence.md, docs/evidence/2026-09-18-a-comment-is-text-the-reader-sees.md]
  - id: markdown-dialect-proven
    title: The parser accepts exactly the Markdown ADR 0022 names — each construct on a fixture — and stops with a line number on anything outside it
    kind: test
    severity: blocking
    enforced_by: {job: tests, tests: [tests/test_markdown.py]}
    proved_by: docs/evidence/2026-09-15-parser-held-to-references.md
  - id: build-faithful-and-byte-stable
    title: The build refuses to write a package that fails its own checker or differs from the Markdown by one character (ADR 0023), and the same input gives the same bytes on every run (ADR 0008)
    kind: test
    severity: blocking
    enforced_by: {job: tests, tests: [tests/test_build.py]}
    proved_by: [docs/evidence/2026-09-15-build-goldens-and-mutations.md, docs/evidence/2026-09-16-options-structure-goldens-and-mutations.md, docs/evidence/2026-09-16-adr-0027-mutations.md, docs/evidence/2026-09-17-word-for-macos.md, docs/evidence/2026-09-18-an-image-is-whole-or-it-is-refused.md, docs/evidence/2026-09-18-the-build-names-what-it-did-not-write.md, docs/evidence/2026-09-19-wps-writer.md, docs/evidence/2026-09-19-a-box-every-reader-can-draw.md]
  - id: markdown-held-to-references
    title: The parser reads every generated document as commonmark.js does (CommonMark-only text) and as cmark-gfm does (GFM text), except in the divergences ADR 0015 names, and refuses only what the reference shows as raw HTML
    kind: test
    severity: blocking
    enforced_by: {job: tests, tests: [tests/test_oracle.py]}
    proved_by: docs/evidence/2026-09-15-parser-held-to-references.md
  - id: deflate-is-defined-not-borrowed
    title: The compressor is this project's own, defined so that both implementations write the same bytes, and what it writes inflates back through zlib and through the skill's own reader (ADR 0008, 0037)
    kind: test
    severity: blocking
    enforced_by: {job: tests, tests: [tests/test_deflate.py]}
    proved_by: docs/evidence/2026-09-19-a-deflate-of-our-own.md
  - id: repack-keeps-what-it-did-not-write
    title: A package written back with nothing replaced is the same bytes; a package with one part rewritten compresses that part with this project's own deflate and keeps every other entry's compressed bytes, method, checksum and date, in both implementations (ADR 0037, 0008)
    kind: test
    severity: blocking
    enforced_by: {job: tests, tests: [tests/test_repack.py]}
    proved_by: docs/evidence/2026-09-18-a-package-comes-back-as-it-went-in.md
  - id: repair-changes-only-what-it-names
    title: Repair writes a new file with findings 1, 2, 3, 5 and order gone and the complex-script font it chose reported, reports every other finding, changes no character of the text, keeps every part it did not rewrite byte for byte, refuses a file the checker refuses, and gives the same bytes from both implementations (ADR 0037, 0023, 0008)
    kind: test
    severity: blocking
    enforced_by: {job: tests, tests: [tests/test_repair.py]}
    proved_by: [docs/evidence/2026-09-18-repair-sets-the-mode-and-drops-noproof.md, docs/evidence/2026-09-18-repair-marks-thai-and-fills-the-twins.md, docs/evidence/2026-09-19-repair-puts-the-properties-back-in-order.md]
  - id: javascript-matches-python
    title: The JavaScript file reads Markdown, writes .docx bytes, reports on sound and damaged packages and answers on the command line exactly as the Python package does (ADR 0008, 0017), stays within the script limits (ADR 0030), and is the bundle its committed sources build
    kind: test
    severity: blocking
    enforced_by: {job: tests, tests: [tests/test_js_parity.py]}
    proved_by: docs/evidence/2026-09-15-javascript-matches-python.md
  - id: release-carries-only-the-skill
    title: A release attaches one archive and its attestation, built from the tag, holding the skill directory and nothing else, refused unless every stated version is the tag, and verified against GitHub and against the attached bundle before either is attached (ADR 0012, 0018)
    kind: job
    severity: blocking
    enforced_by: {job: release-archive}
    proved_by: docs/evidence/2026-09-18-the-release-carries-its-attestation.md
  - id: release-tag-passes-the-gates
    title: The tag a release is cut from — checked out as a tag, never a branch of its name — passes the scans, both lints and the whole suite under its coverage floor on the oldest supported Python before its archive is built, and the archive's attestation is verified against this workflow and that tag (ADR 0012)
    kind: job
    severity: blocking
    enforced_by: {job: release-check}
  - id: skill-archive-is-the-skill
    title: The archive a user downloads holds exactly skills/thai-docx — the same names and the same bytes the installers copy — gives the same bytes on every run, states one version in SKILL.md, the Python package and the JavaScript file, and states it in a front matter that survives being sorted, flattened and unquoted as an installer rewrites it (ADR 0012, 0018)
    kind: test
    severity: blocking
    enforced_by: {job: tests, tests: [tests/test_package_skill.py]}
    proved_by: [docs/evidence/2026-09-15-skill-md-archive-and-agents.md, docs/evidence/2026-09-19-what-the-installers-give-you.md]
  - id: release-oracle-set-is-the-goldens
    title: The documents a release is opened in — every variant once per application, with a checklist naming each — are byte for byte the goldens the build is held to (ADR 0012)
    kind: test
    severity: blocking
    enforced_by: {job: tests, tests: [tests/test_oracle_set.py]}
    proved_by: [docs/evidence/2026-09-16-office-check-five-applications.md, docs/evidence/2026-09-17-word-for-macos.md]
  - id: grill-is-the-users-word
    title: The interview happens only when the user's own message says so — the script reads the message, names the mode, the profile it starts from and the name it saves to, and gives the questions with what each choice means against that start, so no model chooses the mode or works out an answer for the user (ADR 0029)
    kind: test
    severity: blocking
    enforced_by: {job: tests, tests: [tests/test_grill.py]}
    proved_by: [docs/evidence/2026-09-16-grill-is-the-users-word.md, docs/evidence/2026-09-16-grill-from-a-profile.md, docs/evidence/2026-09-18-grill-reads-one-message-one-way.md]
  - id: profiles-are-data
    title: A profile holds only settings a flag could set, checked as flags are; it is found in the project, the home or the skill in that order; saving, exporting and importing stay inside the profile directories, and both implementations write the same bytes (ADR 0024, 0030)
    kind: test
    severity: blocking
    enforced_by: {job: tests, tests: [tests/test_profiles.py]}
    proved_by: [docs/evidence/2026-09-16-profiles-are-data.md, docs/evidence/2026-09-17-profile-save-says-it-replaced.md]
  - id: python-stays-within-the-script-limits
    title: The skill's Python imports only a named list of standard modules, reaches no environment, process or network through os, and builds no code from strings, read from its source (ADR 0030 limits 1, 2 and 6)
    kind: test
    severity: blocking
    enforced_by: {job: tests, tests: [tests/test_script_limits.py]}
    proved_by: docs/evidence/2026-09-17-python-script-limits.md
  - id: settings-in-one-registry
    title: Every setting is one registry entry, the same in both implementations, and the parser, the defaults, the reported settings, the flags a profile holds and the settings reference are derived from it — each example there changing its own setting — and a flag is said to have changed nothing exactly when it changed no byte (ADR 0028)
    kind: test
    severity: blocking
    enforced_by: {job: tests, tests: [tests/test_settings.py]}
    proved_by: docs/evidence/2026-09-16-settings-registry.md
  - id: sources-name-their-licence
    title: Every source file of the project — the skill's Python and JavaScript, the tests and this project's own tools — opens with its SPDX copyright and licence lines, the commonmark.js ports naming BSD-2-Clause and their author too, and the bundle states its parts' lines once (ADR 0031)
    kind: test
    severity: blocking
    enforced_by: {job: tests, tests: [tests/test_licensing.py]}
    proved_by: docs/evidence/2026-09-17-sources-name-their-licence.md
  - id: python-lints-clean
    title: PEP 8 as pycodestyle's errors and warnings read it, lines of at most 150 characters, pyflakes and bugbear find nothing in the skill's Python, the tools or the tests (ruff.toml)
    kind: job
    severity: blocking
    enforced_by: {job: lint}
    proved_by: docs/evidence/2026-09-17-coding-standards.md
  - id: javascript-lints-clean
    title: ESLint's recommended rules find nothing in js/*.js, each part read with the names the others give it in the bundle (tests/js/eslint.config.cjs)
    kind: step
    severity: blocking
    enforced_by: {job: lint, step: eslint}
    proved_by: docs/evidence/2026-09-17-coding-standards.md
  - id: deps-have-no-known-vulnerabilities
    title: Every push and pull request checks the pinned development dependencies against the OSV database for known vulnerabilities and malicious packages, and fails on any; a release is not built while one is open (CONTRIBUTING.md, Dependencies)
    kind: job
    severity: blocking
    enforced_by: {job: deps}
    proved_by: docs/evidence/2026-09-17-dependency-check.md
  - id: sast-codeql
    title: CodeQL's security-extended queries analyse the Python, the JavaScript and the workflows on every pull request, every push to main and weekly; an alert of medium severity or higher is fixed or dismissed with a reason before merge (CONTRIBUTING.md, Static analysis)
    kind: job
    severity: advisory
    enforced_by: {job: codeql}
    proved_by: docs/evidence/2026-09-18-codeql-alerts-triaged.md
  - id: scorecard-published
    title: OpenSSF Scorecard reads main from a git clone (not the export-ignore tarball) weekly and on every push to main, publishes to api.scorecard.dev for the badge and uploads its findings to code scanning; the score is a report, not a merge gate
    kind: job
    severity: watched
    enforced_by: {job: scorecard}
    proved_by: docs/evidence/2026-09-18-scorecard-alerts-triaged.md
    watched_by:
      who: the maintainer
      within_days: 7
      cadence: weekly, the platform's cron, and every push to main
      how: >-
        The run page is the record and GitHub e-mails the workflow's author when a scheduled run fails; a publish the API refuses fails the run. Code scanning lists each check below 10 as an alert.
  - id: suite-passes-on-the-newest-runtimes
    title: The whole suite passes on the newest Python and Node the skill promises, as it does on the oldest (ADR 0008, 0017)
    kind: job
    severity: blocking
    enforced_by: {job: tests-newest}
  - id: suite-covers-the-skill
    title: The suite reaches at least 97% of the branches of the skill's Python, command-line runs included (.coveragerc)
    kind: job
    severity: blocking
    enforced_by: {job: tests}
  - id: skill-md-tells-the-truth
    title: SKILL.md passes the Agent Skills validator from the downloaded archive, stays under its ceiling, and every default, flag, finding code, command and sandbox snippet it gives is the one the skill has, run as written, and every reference it has is linked; the user guides' examples read as they say and name only real flags, their links reach pages and headings that exist in both languages, their commands and the README's run as written from the archive, and the archive they name is this version (ADR 0007, 0014, 0028, 0029)
    kind: test
    severity: blocking
    enforced_by: {job: tests, tests: [tests/test_skill_md.py]}
    proved_by: [docs/evidence/2026-09-15-skill-md-archive-and-agents.md, docs/evidence/2026-09-16-agents-with-the-grown-skill.md, docs/evidence/2026-09-16-agents-after-the-redesign.md, docs/evidence/2026-09-17-agents-with-the-flag-table.md, docs/evidence/2026-09-17-a-description-of-200-characters.md, docs/evidence/2026-09-17-user-guides-hold.md]
  - id: commands-take-only-what-they-should
    title: Every command answers in one JSON line, in both implementations alike — never writing over the file it was given, reading only regular files and each to a ceiling, taking only text as text, reading repair's --font as the build does and escaping it, and taking only profile names and profile data no shell and no parser misreads
    kind: test
    severity: blocking
    enforced_by: {job: tests, tests: [tests/test_what_a_command_takes.py]}
  - id: a-fixed-fault-names-the-test-that-holds-it
    title: Every finding closed since 0.2.0 names in tests/regressions.yaml the test that fails if it returns, a rule a model reads only beside one, and every Fixed line of the changelog after 0.2.0 names its test
    kind: test
    severity: blocking
    enforced_by: {job: tests, tests: [tests/test_regressions.py]}
  - id: repair-reads-xml-as-xml
    title: repair reads every tag the way XML writes it — a quoted `>`, single quotes, an empty run, a run holding a tab, another prefix, a comment or CDATA, a picture's bytes — keeps the space at every cut, compares the text of every part a reader sees, and writes nothing when its output has a fault the input did not, each shown in both implementations or on a planted repair
    kind: test
    severity: blocking
    enforced_by: {job: tests, tests: [tests/test_repair_reads_xml_as_xml.py]}
  - id: check-holds-its-limits-at-their-values
    title: Each limit is the value both implementations state, and is met at that value from the input side through both command lines — the part and total size caps, forty symbolic links and no more — a part is judged UTF-8 on its bytes, so UTF-16 never reaches a parser, and a run nested past any stack gets a verdict
    kind: test
    severity: blocking
    enforced_by: {job: tests, tests: [tests/test_check_holds_its_limits.py]}
  - id: build-writes-what-it-was-given
    title: The build escapes a value where a field holds it and refuses a label a field would misread, links only to http, https or mailto with a URI for a target, starts a list at 0 when it says 0, names every format character and noncharacter from one list, reads tag names as ASCII, fits a picture to the page and never to nothing, and grill reads words, language and what it did not read alike — all in both implementations
    kind: test
    severity: blocking
    enforced_by: {job: tests, tests: [tests/test_build_writes_what_it_was_given.py]}
  - id: release-is-bound-to-its-tag
    title: The release checks out its tag as a tag and proves the commit, holds the tag to the gates a pull request passes, and every way the project says to verify a release — workflow, SECURITY.md, README, both guides — names the release workflow and the tag's ref; the suite runs on the oldest and the newest runtimes promised, and what the tools import is pinned
    kind: test
    severity: blocking
    enforced_by: {job: tests, tests: [tests/test_release_is_bound_to_its_tag.py]}
  - id: amendments-recorded-both-ways
    title: Every amendment is recorded on both records — `Amends:` on the new one names a record whose `Amended by:` names it back, and the reverse — read from each record's head, a link at a time (.github/CONTRIBUTING.md, Add a decision)
    kind: test
    severity: blocking
    enforced_by: {job: tests, tests: [tests/test_adr_amendments.py]}
  - id: live-pages-cite-the-record-in-force
    title: The rules page is one text — Thai the rule, the English below it marked a translation — every link on it reaches a file, each rule traces to a record the index marks accepted, the pages that decide send a reader there, and no live page of this project cites a record the index marks superseded unless it names the record in force on the same line (docs/rules.md, ADR 0001)
    kind: test
    severity: blocking
    enforced_by: {job: tests, tests: [tests/test_rules.py]}
    proved_by: docs/evidence/2026-09-19-the-rules-and-the-records-they-cite.md
