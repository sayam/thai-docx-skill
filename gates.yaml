# This project's gate registry. vgproj wrote the first four rows; the rest are
# this skill's own gates, each pointing at the job that decides it. The scans
# about templates, services, entrypoints and Dockerfiles answer NA on a tree
# that has none. `gates-registry-total` holds this index to the workflows and
# the test files in both directions.

version: 1
gates:
  - id: adr-index-complete
    title: The ADR index covers every record, numbered without repeats or gaps · and supersessions are recorded in both directions
    kind: job
    severity: blocking
    enforced_by: {job: scans}
  - id: gates-registry-total
    title: The gate index matches reality in both directions, and every test file is accounted for
    kind: job
    severity: blocking
    enforced_by: {job: scans}
  - id: actions-sha-pinned
    title: Every action is pinned to a commit SHA with the version in a comment
    kind: job
    severity: blocking
    enforced_by: {job: scans}
  - id: ci-tools-hash-pinned
    title: Tools CI installs for itself are pinned by hash, on both the Python and the Node side
    kind: job
    severity: blocking
    enforced_by: {job: scans}
  - id: docx-checker-proven-two-way
    title: The checker names each of the five causes (ADR 0004), invisible text and misordered properties on a planted violation, passes a clean package, and refuses DOCTYPE and oversized packages
    kind: test
    severity: blocking
    enforced_by: {job: tests, tests: [tests/test_check.py]}
    proved_by: docs/evidence/2026-09-15-checker-red-evidence.md
