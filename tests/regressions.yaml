# What was found broken, and what now holds it fixed. A fault is closed by a control, not by a
# change: each row names the test that fails if the fault comes back (tests/test_regressions.py
# holds every row to it).
#
# id        the finding's name in the review that found it
# what      the fault, as a user or an agent met it
# class     how it is held (comma-separated): C0 the wrong path no longer exists (one reader, one escape point);
#           C1 a test that fails when it returns; C2 a rule a person or a model reads — only
#           beside a C1; C3 a check after the work, by a person or in a real application — only
#           with the record it is written in
# found_by  review · outside-review · parity · planted-input · agent-run · office-app
# test      pytest node ids, `file::function`
# record    the evidence record, where a C3 row needs one

- id: R3
  what: repair wrote over the file it was given — the same path, a symbolic link to it, or a hard link
